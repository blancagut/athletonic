    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Private Muay Thai Catalog | Athletonic</title>
    <meta name="description" content="Private Athletonic catalog for approved Muay Thai clients." />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <link rel="canonical" href="https://athletonic.com/muaythai_mma" />
    <link rel="icon" href="../../favicon.ico" sizes="any" />
    <link rel="manifest" href="../../site.webmanifest" />
    <link rel="stylesheet" href="../../styles.css" />
    <style>
      .vip-body { background: #f4f6f8; color: #0b2340; }
      .vip-header { position: sticky; top: 0; z-index: 20; background: #09213b; border-bottom: 1px solid #27425e; }
      .vip-header-inner { width: min(1440px, calc(100% - 32px)); margin: 0 auto; min-height: 78px; display: flex; align-items: center; gap: 24px; }
      .vip-logo { display: inline-flex; width: 62px; flex: 0 0 62px; }
      .vip-logo img { width: 100%; height: 46px; object-fit: contain; }
      .vip-header-title { color: #fff; min-width: 0; }
      .vip-header-title strong { display: block; font-size: 19px; }
      .vip-header-title span { color: #b8c7d7; font-size: 13px; }
      .vip-shell { width: min(1440px, calc(100% - 32px)); margin: 0 auto; padding: 30px 0 64px; }
      .vip-heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
      .vip-heading h1 { margin: 0; font-size: clamp(30px, 4vw, 52px); line-height: 1; letter-spacing: 0; }
      .vip-heading p { margin: 8px 0 0; color: #617187; }
      .vip-count { white-space: nowrap; color: #52647a; font-weight: 700; }
      .vip-controls { position: sticky; top: 78px; z-index: 15; display: grid; grid-template-columns: minmax(240px, 1fr) 220px 220px; gap: 12px; padding: 14px; margin-bottom: 24px; background: #fff; border: 1px solid #d7e0e9; box-shadow: 0 8px 24px rgba(11, 35, 64, .08); }
      .vip-controls label { display: grid; gap: 6px; color: #52647a; font-size: 12px; font-weight: 800; text-transform: uppercase; }
      .vip-controls input, .vip-controls select { width: 100%; min-height: 46px; padding: 0 13px; border: 1px solid #c9d5e1; border-radius: 4px; background: #fff; color: #0b2340; font: inherit; }
      .vip-brand-tabs { display: flex; gap: 8px; overflow-x: auto; margin: 0 0 22px; padding: 0 0 5px; }
      .vip-brand-tabs button { min-height: 38px; padding: 0 15px; border: 1px solid #c9d5e1; border-radius: 4px; background: #fff; color: #0b2340; font-weight: 800; white-space: nowrap; cursor: pointer; }
      .vip-brand-tabs button[aria-pressed="true"] { border-color: #20bfb8; background: #20bfb8; }
      .vip-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
      .vip-grid .product-card { min-width: 0; border-radius: 6px; display: flex; flex-direction: column; }
      .vip-grid .product-image { aspect-ratio: 1 / 1; }
      .vip-grid .product-image img { height: 100%; object-fit: contain; }
      .vip-grid .product-body { display: flex; flex: 1; flex-direction: column; padding: 14px; }
      .vip-grid .product-body > span { color: #52647a; font-size: 11px; font-weight: 800; text-transform: uppercase; }
      .vip-grid .product-body h2 { margin: 7px 0 9px; font-size: 16px; line-height: 1.2; letter-spacing: 0; }
      .vip-grid .product-body h2 a { color: inherit; text-decoration: none; }
      .vip-grid .product-category { margin: 0 0 12px; color: #617187; font-size: 12px; }
      .vip-grid .product-price-line { margin-top: auto; margin-bottom: 12px; }
      .vip-grid .product-price-line strong { font-size: 22px; }
      .vip-grid .product-options-button { display: flex; align-items: center; justify-content: center; min-height: 42px; }
      .vip-empty { padding: 48px 20px; text-align: center; color: #617187; }
      .vip-load-more { display: block; min-width: 220px; min-height: 48px; margin: 28px auto 0; border: 0; border-radius: 4px; background: #0b2340; color: #fff; font-weight: 800; cursor: pointer; }
      @media (max-width: 1100px) { .vip-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
      @media (max-width: 820px) {
        .vip-header-inner, .vip-shell { width: min(100% - 20px, 1440px); }
        .vip-heading { align-items: start; flex-direction: column; gap: 8px; }
        .vip-controls { top: 70px; grid-template-columns: 1fr 1fr; }
        .vip-controls .vip-search { grid-column: 1 / -1; }
        .vip-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      }
      @media (max-width: 460px) {
        .vip-header-title span { display: none; }
        .vip-controls { grid-template-columns: 1fr; }
        .vip-controls .vip-search { grid-column: auto; }
        .vip-grid .product-body { padding: 11px; }
        .vip-grid .product-body h2 { font-size: 14px; }
      }
    </style>
  </head>
  <body class="vip-body">
    <header class="vip-header">
      <div class="vip-header-inner">
        <a class="vip-logo" href="../../" aria-label="Athletonic home"><img src="../../assets/logo.png" alt="Athletonic" /></a>
        <div class="vip-header-title"><strong>Private Muay Thai Catalog</strong><span>Approved client access</span></div>
      </div>
    </header>

    <main class="vip-shell">
      <div class="vip-heading">
        <div><h1>Muay Thai &amp; MMA</h1><p>Boon, Top King, Twins Special, Fairtex and Raja Boxing.</p></div>
        <span class="vip-count" data-vip-count>Loading products...</span>
      </div>

      <section class="vip-controls" aria-label="Catalog filters">
        <label class="vip-search">Search<input type="search" placeholder="Gloves, shorts, pads, SKU..." data-vip-search /></label>
        <label>Brand<select data-vip-brand><option value="">All brands</option></select></label>
        <label>Category<select data-vip-category><option value="">All categories</option></select></label>
      </section>

      <div class="vip-brand-tabs" data-vip-tabs aria-label="Brand filters"></div>
      <div class="vip-grid" data-vip-grid></div>
      <p class="vip-empty" data-vip-empty hidden>No products found.</p>
      <button class="vip-load-more" type="button" data-vip-more hidden>Load more</button>
    </main>

    <script>
      (function () {
        var allowed = ['boon', 'topking', 'twins_special', 'fairtex', 'raja_boxing'];
        var brandOrder = ['Twins Special', 'Boon', 'Fairtex', 'Top King', 'Raja Boxing'];
        var grid = document.querySelector('[data-vip-grid]');
        var count = document.querySelector('[data-vip-count]');
        var search = document.querySelector('[data-vip-search]');
        var brand = document.querySelector('[data-vip-brand]');
        var category = document.querySelector('[data-vip-category]');
        var tabs = document.querySelector('[data-vip-tabs]');
        var empty = document.querySelector('[data-vip-empty]');
        var more = document.querySelector('[data-vip-more]');
        var products = [];
        var shown = 60;

        function escapeHtml(value) {
          return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
        function text(product) {
          return [product.name, product.brand, product.section_title, product.section_id, product.sku, product.id].filter(Boolean).join(' ').toLowerCase();
        }
        function card(product) {
          var url = product.url || '/product/' + encodeURIComponent(product.id) + '.html';
          var image = product.image || product.image_url || '/assets/logo.png';
          var variants = Array.isArray(product.variants) ? product.variants.length : 0;
          return '<article class="product-card"><a class="product-image" href="' + escapeHtml(url) + '"><img src="' + escapeHtml(image) + '" alt="' + escapeHtml(product.name) + '" loading="lazy" decoding="async" /></a>' +
            '<div class="product-body"><span>' + escapeHtml(product.brand) + '</span><h2><a href="' + escapeHtml(url) + '">' + escapeHtml(product.name) + '</a></h2>' +
            '<p class="product-category">' + escapeHtml(product.section_title || 'Training gear') + '</p><div class="product-price-line"><strong>$' + (Number(product.price_cents || 0) / 100).toFixed(2) + '</strong></div>' +
            '<a class="add-cart-button product-options-button" href="' + escapeHtml(url) + '">' + (variants > 1 ? 'View options' : 'View product') + '</a></div></article>';
        }
        function filteredProducts() {
          var query = search.value.trim().toLowerCase();
          return products.filter(function (product) {
            return (!query || text(product).indexOf(query) !== -1) && (!brand.value || product.brand_slug === brand.value) && (!category.value || product.section_id === category.value);
          });
        }
        function render() {
          var filtered = filteredProducts();
          var visible = filtered.slice(0, shown);
          grid.innerHTML = visible.map(card).join('');
          count.textContent = filtered.length + ' product' + (filtered.length === 1 ? '' : 's');
          empty.hidden = filtered.length !== 0;
          more.hidden = shown >= filtered.length;
          Array.from(tabs.querySelectorAll('button')).forEach(function (button) { button.setAttribute('aria-pressed', String(button.dataset.brand === brand.value)); });
        }
        function resetAndRender() { shown = 60; render(); }
        fetch('/data/final/catalog.published.json', { cache: 'no-store' }).then(function (response) {
          if (!response.ok) throw new Error('Catalog unavailable');
          return response.json();
        }).then(function (payload) {
          var all = Array.isArray(payload) ? payload : (payload.products || []);
          var seen = new Set();
          products = all.filter(function (product) {
            var id = String(product.id || '');
            if (!allowed.includes(String(product.brand_slug || '').toLowerCase()) || !id || seen.has(id)) return false;
            seen.add(id);
            return true;
          }).sort(function (a, b) {
            return brandOrder.indexOf(a.brand) - brandOrder.indexOf(b.brand) || String(a.section_title || '').localeCompare(String(b.section_title || '')) || String(a.name || '').localeCompare(String(b.name || ''));
          });
          brandOrder.forEach(function (name) {
            var product = products.find(function (item) { return item.brand === name; });
            if (!product) return;
            brand.insertAdjacentHTML('beforeend', '<option value="' + escapeHtml(product.brand_slug) + '">' + escapeHtml(name) + '</option>');
          });
          Array.from(new Map(products.map(function (product) { return [product.section_id, product.section_title || product.section_id]; })).entries()).sort(function (a, b) { return String(a[1]).localeCompare(String(b[1])); }).forEach(function (entry) {
            category.insertAdjacentHTML('beforeend', '<option value="' + escapeHtml(entry[0]) + '">' + escapeHtml(entry[1]) + '</option>');
          });
          tabs.innerHTML = '<button type="button" data-brand="" aria-pressed="true">All</button>' + brandOrder.map(function (name) {
            var product = products.find(function (item) { return item.brand === name; });
            return product ? '<button type="button" data-brand="' + escapeHtml(product.brand_slug) + '" aria-pressed="false">' + escapeHtml(name) + '</button>' : '';
          }).join('');
          render();
        }).catch(function () { count.textContent = 'Could not load products.'; empty.hidden = false; });
        search.addEventListener('input', resetAndRender);
        brand.addEventListener('change', resetAndRender);
        category.addEventListener('change', resetAndRender);
        tabs.addEventListener('click', function (event) { var button = event.target.closest('button[data-brand]'); if (!button) return; brand.value = button.dataset.brand; resetAndRender(); });
        more.addEventListener('click', function () { shown += 60; render(); });
      })();
    </script>
  </body>
</html>
