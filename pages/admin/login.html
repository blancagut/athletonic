<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Athletonic Admin · Sign in</title>
    <link rel="stylesheet" href="../../styles.css" />
    <link rel="stylesheet" href="../../assets/admin/admin.css" />
  </head>
  <body class="admin-auth-body">
    <main class="admin-auth-card">
      <div class="admin-auth-brand">Athletonic<span>Admin</span></div>
      <h1>Sign in</h1>
      <p class="admin-auth-lead">
        Enter your authorized admin email and password to access the dashboard.
      </p>

      <form id="admin-login-form" class="admin-auth-form" novalidate onsubmit="return false">
        <label for="email">Admin email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="you@athletonic.com"
          required
        />
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="Admin password"
          required
        />
        <button type="submit" id="submit-btn" class="admin-btn admin-btn-primary" disabled>
          Sign in
        </button>
      </form>

      <p id="auth-message" class="admin-auth-message" role="status" aria-live="polite"></p>
      <p class="admin-auth-footnote">
        Access is restricted to authorized administrators. All actions are logged.
      </p>
    </main>

    <script>
      window.ATHLETONIC_SUPABASE_URL = "https://spdvsaozvdcvztinsuex.supabase.co";
      window.ATHLETONIC_SUPABASE_KEY = "sb_publishable_OI_aEjYX0fB4tp7Ui2bk5A_001Jga0T";
    </script>
    <script type="module" src="../../assets/admin/admin-login.js?v=20260622-direct-auth"></script>
  </body>
</html>
