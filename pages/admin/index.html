<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Athletonic Admin</title>
    <link rel="stylesheet" href="../../styles.css" />
    <link rel="stylesheet" href="../../assets/admin/admin.css" />
  </head>
  <body class="admin-body">
    <div id="admin-loading" class="admin-loading">
      <div class="admin-spinner" aria-hidden="true"></div>
      <p>Verifying your session…</p>
    </div>

    <div id="admin-shell" class="admin-shell" hidden>
      <aside class="admin-sidebar">
        <div class="admin-logo">Athletonic<span>Admin</span></div>
        <nav class="admin-nav" id="admin-nav">
          <a href="#/dashboard" data-route="dashboard" class="admin-nav-link">
            <span class="admin-nav-ico">▥</span> Dashboard
          </a>
          <a href="#/orders" data-route="orders" class="admin-nav-link">
            <span class="admin-nav-ico">▦</span> Orders
          </a>
          <a href="#/returns" data-route="returns" class="admin-nav-link">
            <span class="admin-nav-ico">↩</span> Returns
          </a>
          <a href="#/intents" data-route="intents" class="admin-nav-link">
            <span class="admin-nav-ico">◔</span> Checkout intents
          </a>
          <a href="#/catalog" data-route="catalog" class="admin-nav-link">
            <span class="admin-nav-ico">▤</span> Catalog
          </a>
          <a href="#/variant-pricing" data-route="variant-pricing" class="admin-nav-link" data-requires="super_admin">
            <span class="admin-nav-ico">◫</span> Variant pricing
          </a>
          <a href="#/wholesaleApplications" data-route="wholesaleApplications" class="admin-nav-link" data-requires="super_admin">
            <span class="admin-nav-ico">□</span> Wholesale applications
          </a>
          <a href="#/wholesaleQuotes" data-route="wholesaleQuotes" class="admin-nav-link" data-requires="super_admin">
            <span class="admin-nav-ico">▧</span> Orders &amp; quotes
          </a>
          <a href="#/privatePricing" data-route="privatePricing" class="admin-nav-link" data-requires="super_admin">
            <span class="admin-nav-ico">◇</span> Private pricing
          </a>
          <a href="#/users" data-route="users" class="admin-nav-link" data-requires="super_admin">
            <span class="admin-nav-ico">◍</span> Users &amp; admins
          </a>
          <a href="#/settings" data-route="settings" class="admin-nav-link" data-requires="super_admin">
            <span class="admin-nav-ico">⚙</span> Settings
          </a>
          <a href="#/audit" data-route="audit" class="admin-nav-link">
            <span class="admin-nav-ico">≣</span> Audit log
          </a>
        </nav>
        <div class="admin-sidebar-footer">
          <div class="admin-user">
            <span id="admin-user-email" class="admin-user-email"></span>
            <span id="admin-user-role" class="admin-badge"></span>
          </div>
          <button id="admin-signout" class="admin-btn admin-btn-ghost">Sign out</button>
        </div>
      </aside>

      <main class="admin-main">
        <header class="admin-topbar">
          <h1 id="admin-view-title">Dashboard</h1>
          <div id="admin-topbar-actions" class="admin-topbar-actions"></div>
        </header>
        <section id="admin-view" class="admin-view" aria-live="polite"></section>
      </main>
    </div>

    <div id="admin-toast" class="admin-toast" role="status" aria-live="polite" hidden></div>

    <script>
      window.ATHLETONIC_SUPABASE_URL = "https://spdvsaozvdcvztinsuex.supabase.co";
      window.ATHLETONIC_SUPABASE_KEY = "sb_publishable_OI_aEjYX0fB4tp7Ui2bk5A_001Jga0T";
      window.__athletonicAdminBooted = false;
      window.__athletonicAdminShowBootError = function (message) {
        window.__athletonicAdminBooted = true;
        var loading = document.getElementById("admin-loading");
        if (!loading) return;
        loading.innerHTML =
          '<p class="admin-error">' + message + '</p>' +
          '<p><a class="admin-btn" href="./login.html">Back to sign in</a></p>';
      };
      window.setTimeout(function () {
        var shell = document.getElementById("admin-shell");
        if (!window.__athletonicAdminBooted && shell && shell.hidden) {
          window.__athletonicAdminShowBootError(
            "The admin app did not finish loading. Please refresh this page or sign in again."
          );
        }
      }, 6000);
    </script>
    <script
      type="module"
      src="../../assets/admin/admin-app.js?v=20260630-wholesale-quotes"
      onerror="window.__athletonicAdminShowBootError && window.__athletonicAdminShowBootError('The admin app script could not load. Please refresh this page.')"
    ></script>
  </body>
</html>
