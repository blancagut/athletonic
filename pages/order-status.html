<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order Status | Athletonic</title>
    <meta name="description" content="Check the live status of your Athletonic order request." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://www.athletonic.com/order-status" />
    <!-- hreflang:start -->
    <link rel="alternate" hreflang="en" href="https://athletonic.com/pages/order-status.html" />
    <link rel="alternate" hreflang="es" href="https://athletonic.com/es/pages/order-status.html" />
    <link rel="alternate" hreflang="x-default" href="https://athletonic.com/pages/order-status.html" />
    <!-- hreflang:end -->
    <link rel="icon" href="../favicon.ico" sizes="any" />
    <link rel="manifest" href="../site.webmanifest" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body.order-status-body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #0f172a;
        background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
        min-height: 100vh;
      }
      .os-shell { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
      .os-header { display: flex; align-items: center; gap: 14px; padding: 12px 0 28px; }
      .os-header img { width: 130px; height: auto; display: block; }
      .os-header span {
        font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
        color: #64748b; font-weight: 700; border-left: 1px solid #cbd5e1; padding-left: 14px;
      }
      .os-card {
        background: #fff; border: 1px solid #e2e8f0; border-radius: 20px;
        padding: 28px; box-shadow: 0 12px 40px rgba(15, 23, 42, 0.06);
      }
      .os-card h1 { margin: 0 0 6px; font-size: 26px; }
      .os-card > p { margin: 0 0 20px; color: #475569; }
      .os-lookup { display: flex; gap: 10px; flex-wrap: wrap; }
      .os-lookup input {
        flex: 1; min-width: 220px; padding: 12px 14px; font: inherit;
        border: 1px solid #cbd5e1; border-radius: 10px;
      }
      .os-lookup button {
        padding: 12px 22px; font: inherit; font-weight: 700; cursor: pointer;
        background: #0f172a; color: #fff; border: 0; border-radius: 10px;
      }
      .os-status-line { margin: 16px 0 0; font-size: 14px; color: #b91c1c; min-height: 18px; }
      .os-result { margin-top: 24px; display: none; }
      .os-result[data-visible="true"] { display: block; }
      .os-badge {
        display: inline-block; padding: 8px 16px; border-radius: 999px;
        font-weight: 800; font-size: 14px; letter-spacing: 0.04em;
      }
      .os-badge[data-status="new"] { background: #dbeafe; color: #1d4ed8; }
      .os-badge[data-status="contacted"] { background: #fef3c7; color: #92400e; }
      .os-badge[data-status="quoted"] { background: #d1fae5; color: #047857; }
      .os-badge[data-status="closed"] { background: #e2e8f0; color: #334155; }
      .os-steps { list-style: none; margin: 24px 0; padding: 0; }
      .os-steps li {
        position: relative; padding: 0 0 22px 34px; color: #94a3b8; font-size: 15px;
      }
      .os-steps li::before {
        content: ""; position: absolute; left: 9px; top: 22px; bottom: 0;
        width: 2px; background: #e2e8f0;
      }
      .os-steps li:last-child::before { display: none; }
      .os-steps li::after {
        content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px;
        border-radius: 50%; background: #e2e8f0; border: 2px solid #cbd5e1; box-sizing: border-box;
      }
      .os-steps li[data-done="true"] { color: #0f172a; font-weight: 600; }
      .os-steps li[data-done="true"]::after { background: #10b981; border-color: #059669; }
      .os-steps li small { display: block; font-weight: 400; color: #64748b; margin-top: 2px; }
      .os-meta { display: flex; gap: 24px; flex-wrap: wrap; margin: 18px 0 0; padding: 16px 0 0; border-top: 1px solid #e2e8f0; }
      .os-meta div { min-width: 120px; }
      .os-meta small { display: block; color: #64748b; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
      .os-meta strong { font-size: 15px; }
      .os-items { margin: 22px 0 0; padding: 0; list-style: none; }
      .os-items li {
        display: flex; align-items: center; gap: 14px; padding: 12px 0;
        border-top: 1px solid #f1f5f9;
      }
      .os-items img {
        width: 52px; height: 52px; object-fit: cover; border-radius: 10px;
        border: 1px solid #e2e8f0; background: #f8fafc;
      }
      .os-items .os-item-body { flex: 1; min-width: 0; }
      .os-items .os-item-body strong { display: block; font-size: 14px; line-height: 1.3; }
      .os-items .os-item-body span { color: #64748b; font-size: 13px; }
      .os-footer { margin-top: 28px; text-align: center; color: #64748b; font-size: 13px; }
      .os-footer a { color: #0f172a; }
    </style>
  </head>
  <body class="order-status-body">
    <div class="os-shell">
      <header class="os-header">
        <a href="../" aria-label="Athletonic home"><img src="../assets/logo.png" alt="Athletonic" /></a>
        <span>Order Status</span>
      </header>

      <div class="os-card">
        <h1>Track your order</h1>
        <p>Scan the QR code on your PDF confirmation, or paste your order reference below.</p>
        <form class="os-lookup" data-os-form>
          <input type="text" name="ref" placeholder="Order reference (e.g. 0ae7c3a0-b384-...)" data-os-input required />
          <button type="submit">Check status</button>
        </form>
        <p class="os-status-line" data-os-error aria-live="polite"></p>

        <div class="os-result" data-os-result>
          <span class="os-badge" data-os-badge></span>
          <ol class="os-steps" data-os-steps></ol>
          <div class="os-meta" data-os-meta></div>
          <ul class="os-items" data-os-items></ul>
        </div>
      </div>

      <p class="os-footer">
        Questions? Write to <a href="mailto:sales@athletonic.com">sales@athletonic.com</a> and include your reference.
      </p>
    </div>

    <script>
      (function () {
        var API = "/api/wholesale/quote-requests";
        var form = document.querySelector("[data-os-form]");
        var input = document.querySelector("[data-os-input]");
        var errorEl = document.querySelector("[data-os-error]");
        var resultEl = document.querySelector("[data-os-result]");
        var badgeEl = document.querySelector("[data-os-badge]");
        var stepsEl = document.querySelector("[data-os-steps]");
        var metaEl = document.querySelector("[data-os-meta]");
        var itemsEl = document.querySelector("[data-os-items]");

        var STATUS_LABELS = {
          new: "Order received",
          contacted: "Our team is reviewing your order",
          quoted: "Quotation / invoice sent",
          closed: "Completed",
        };
        var STEP_ORDER = ["new", "contacted", "quoted", "closed"];
        var STEP_COPY = {
          new: ["Order received", "We got your request and it is in our queue."],
          contacted: ["In review", "Our sales team is confirming availability and shipping."],
          quoted: ["Quotation sent", "Check your email for the final quotation or invoice."],
          closed: ["Completed", "This order has been completed. Thank you!"],
        };

        function escapeHtml(v) {
          return String(v || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
        function formatDate(v) {
          if (!v) return "—";
          try { return new Intl.DateTimeFormat("en-US", { dateStyle: "medium", timeStyle: "short" }).format(new Date(v)); }
          catch (e) { return v; }
        }
        function setError(msg) { errorEl.textContent = msg || ""; }

        function render(order) {
          var status = order.status;
          badgeEl.textContent = STATUS_LABELS[status] || status;
          badgeEl.dataset.status = status;

          var reachedIndex = STEP_ORDER.indexOf(status);
          stepsEl.innerHTML = STEP_ORDER.map(function (step, i) {
            var done = i <= reachedIndex;
            var copy = STEP_COPY[step];
            return '<li data-done="' + done + '"><strong>' + escapeHtml(copy[0]) + "</strong><small>" + escapeHtml(copy[1]) + "</small></li>";
          }).join("");

          metaEl.innerHTML =
            '<div><small>Reference</small><strong>' + escapeHtml(order.id.split("-")[0].toUpperCase()) + "</strong></div>" +
            '<div><small>Placed</small><strong>' + escapeHtml(formatDate(order.created_at)) + "</strong></div>" +
            '<div><small>Products</small><strong>' + escapeHtml(order.item_count) + "</strong></div>" +
            '<div><small>Units</small><strong>' + escapeHtml(order.quantity_count) + "</strong></div>";

          itemsEl.innerHTML = (order.items || []).map(function (item) {
            var options = Object.keys(item.selected_options || {}).map(function (k) {
              return escapeHtml(k) + ": " + escapeHtml(item.selected_options[k]);
            }).join(" · ");
            return (
              "<li>" +
              (item.image_url ? '<img src="' + escapeHtml(item.image_url) + '" alt="" loading="lazy" />' : "") +
              '<div class="os-item-body"><strong>' + escapeHtml(item.name) + "</strong><span>" +
              escapeHtml(item.brand || "") + " · Qty " + escapeHtml(item.quantity) + (options ? " · " + options : "") +
              "</span></div></li>"
            );
          }).join("");

          resultEl.dataset.visible = "true";
        }

        function lookup(ref) {
          setError("");
          resultEl.dataset.visible = "false";
          var clean = String(ref || "").trim().toLowerCase();
          // Accept full UUID or pasted reference with prefix like AW-XXXXXXXX
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(clean)) {
            setError("Enter the full order reference from your confirmation email or QR code.");
            return;
          }
          fetch(API + "?status_id=" + encodeURIComponent(clean), { headers: { Accept: "application/json" } })
            .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, body: b }; }); })
            .then(function (r) {
              if (!r.ok) { setError(r.body.message || "We could not find that order."); return; }
              render(r.body.order);
            })
            .catch(function () { setError("Connection error. Please try again."); });
        }

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          lookup(input.value);
        });

        var params = new URLSearchParams(window.location.search);
        var ref = params.get("ref") || params.get("id");
        if (ref) {
          input.value = ref;
          lookup(ref);
        }
      })();
    </script>
  </body>
</html>
